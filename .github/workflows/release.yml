name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug -PapiBaseUrl=${{ vars.CORE_API_URL }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk machineguard-${{ github.ref_name }}.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} machineguard-${{ github.ref_name }}.apk --title ${{ github.ref_name }} --generate-notes
